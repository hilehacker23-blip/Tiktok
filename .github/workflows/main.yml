name: TikTok Sandik Botu

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "*/10 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install TikTokLive python-telegram-bot aiohttp

    - name: Botu Başlat
      run: |
        python main.py
        
